[supervisord]
nodaemon=true
user=root
directory=/tmp
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=warn

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
autorestart=true
startretries=3

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
user=www-data
environment=HOME="/home/www-data"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
autorestart=true
startretries=3

; Laravel scheduler: runs the queue (imports), link checks every two hours
; and the daily backup, as upstream's cron entry would.
[program:scheduler]
command=/usr/local/bin/php /app/artisan schedule:work
directory=/app
user=www-data
environment=HOME="/home/www-data"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
autorestart=true
startretries=3

; If any program fails for good (FATAL), stop supervisord so start.sh exits 1
; and Railway restarts the whole container.
[eventlistener:fatal]
command=/railway/fatal-listener.sh
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
